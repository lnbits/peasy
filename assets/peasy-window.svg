    <path d="M0-9v3M0 6v3M-9 0h3M6 0h3M-6.4-6.4l2.2 2.2M4.2 4.2l2.2 2.2M6.4-6.4L4.2-4.2M-4.2 4.2l-2.2 2.2"/>
  </g>
