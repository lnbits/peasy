  <path d="m413 16 8 8m0-8-8 8" stroke="#f6f5f4" stroke-width="1.6"/>

  <rect x="29" y="113" width="384" height="34" rx="8" fill="#343337" stroke="#3584e4" stroke-width="2"/>
  <text x="38" y="135" fill="#9a9996" font-family="system-ui, sans-serif" font-size="15">install telegram...</text>

  <rect x="343" y="193" width="70" height="34" rx="9" fill="#3584e4"/>
  <text x="378" y="215" fill="#fff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Send</text>
