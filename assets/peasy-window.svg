<svg xmlns="http://www.w3.org/2000/svg" width="438" height="250" viewBox="0 0 438 250" role="img" aria-labelledby="title description">
  <title id="title">Peasy request window</title>
  <desc id="description">Peasy prompting the user to tell their computer what they want.</desc>
  <defs>
    <clipPath id="window">
      <rect x="1" y="1" width="436" height="248" rx="13"/>
    </clipPath>
  </defs>
  <g clip-path="url(#window)">
    <rect x="1" y="1" width="436" height="248" fill="#202024"/>
    <rect x="1" y="1" width="436" height="39" fill="#2c2b30"/>
    <path d="M1 40h436" stroke="#36343b"/>
  </g>
  <rect x="1" y="1" width="436" height="248" rx="13" fill="none" stroke="#343239"/>

  <g fill="#f6f5f4" font-family="system-ui, sans-serif">
