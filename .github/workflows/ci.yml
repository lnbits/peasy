name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
      - name: Rust formatting, tests, Clippy and catalogue contracts
        run: nix develop --command bash scripts/check-rust.sh
      - name: Audit locked dependencies against current advisories
        run: nix shell --inputs-from . nixpkgs#cargo-audit --command cargo audit --file Cargo.lock

  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: Prepare the disposable hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          # NixOS tests require hardware virtualization on this Linux runner.
          sudo chmod a+rw /dev/kvm
          df -h /nix/store
      - name: All native flake checks, including networking and sandbox VMs
        run: |
          # Run each check separately so full evaluation does not retain several
          # desktop configurations in memory alongside a VM. Build first: the
          # networking VM imports a fixture generated by the compiled daemon.
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames > checks.json
          jq -r '.[]' checks.json > checks.txt
          check_status=0
          while IFS= read -r check; do
            nix build --no-link -L --max-jobs 1 ".#checks.x86_64-linux.$check" || check_status=1
          done < checks.txt
          nix flake check --no-build || check_status=1
          exit "$check_status"
