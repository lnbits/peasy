name: NixOS ISO Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check release safeguards, locked SDK, website and workflow
        run: nix build --no-link -L .#checks.x86_64-linux.release
      - name: Validate non-secret R2 configuration before release builds
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          nix build .#iso-release-tools --out-link result-release-tools
          ./result-release-tools/bin/python3 -B -c 'import sys; sys.path.insert(0, "scripts"); import r2_isos; r2_isos.configuration()'

  security:
    needs: release-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Check privileged boundaries and system configuration
        shell: bash
        run: |
          set -euo pipefail
          # Only unused SDKs on this disposable GitHub-hosted runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /nix/store
          nix build --no-link -L --max-jobs 1 \
            .#checks.x86_64-linux.sandbox-fixture \
            .#checks.x86_64-linux.core-package \
            .#checks.x86_64-linux.system-configuration \
            .#checks.x86_64-linux.sandbox
      - name: Preserve security VM diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          drv=$(nix eval --raw .#checks.x86_64-linux.sandbox.drvPath) || exit 0
          nix log "$drv" > diagnostics/security.log 2>&1 || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: peasy-security-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: release-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome]
    env:
      DESKTOP: ${{ matrix.desktop }}
      EVENT_NAME: ${{ github.event_name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Verify target persistence before any release build
        shell: bash
        run: |
          set -euo pipefail
          nix eval --json .#lib.isoReleaseStatus > iso-status.json
          cat iso-status.json
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            jq -e '.releaseReady == true and .installedTargetHasPeasy == true and .installedBootVerified == true' iso-status.json || {
              echo '::error::Release blocked; see iso-status.json for installation validation and distribution requirements.'
              exit 1
            }
          fi
      - name: Make room on this disposable GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          # Only unused, preinstalled SDKs on the fresh hosted runner; never run on a workstation.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /nix/store
          available=$(df --output=avail -B1 /nix/store | tail -1)
          (( available >= 45 * 1024 * 1024 * 1024 )) || {
            echo '::error::At least 45 GiB free space is required for the ISO and installed-disk tests; use a larger runner.'
            exit 1
          }
      - name: Static checks and both installer desktops' tray regressions
        shell: bash
        run: |
          set -euo pipefail
          # Keep this before builds: a warm store can hide invalid test dependencies.
          nix flake check --no-build
          nix build --no-link \
            .#checks.x86_64-linux.formatting \
            .#checks.x86_64-linux.sandbox-fixture \
            .#checks.x86_64-linux.desktop-config \
            .#checks.x86_64-linux.iso-config \
            .#checks.x86_64-linux.installer-target \
            .#checks.x86_64-linux.wasm-imports
          # Installed-system acceptance runs against the actual ISO below.
          # Keep the desktop-specific tray regression as a separate check.
          nix build --no-link --max-jobs 1 \
            ".#checks.x86_64-linux.${DESKTOP}-tray" \
            .#checks.x86_64-linux.xfce-tray
      - name: Build ISO and checksums
        shell: bash
        run: |
          set -euo pipefail
          nix build ".#iso-${DESKTOP}" --out-link result-iso
          mapfile -t images < <(find -L result-iso/iso -maxdepth 1 -type f -name '*.iso')
          [[ ${#images[@]} == 1 ]]
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[A-Za-z0-9._-]+$ ]]
            version="$REF_NAME"
          else
            version="experimental-${COMMIT:0:12}"
          fi
          filename="peasy-nixos-${version}-${DESKTOP}-x86_64.iso"
          mkdir -p artifacts
          cp -- "${images[0]}" "artifacts/$filename"
          cp iso-status.json "artifacts/${DESKTOP}-iso-status.json"
          cd artifacts
          sha256sum "$filename" > "$filename.sha256"
          sha256sum --check "$filename.sha256"
      - name: Fresh offline BIOS and UEFI installs of the actual release ISO
        shell: bash
        run: |
          set -euo pipefail
          nix build .#iso-test-tools --out-link result-iso-test-tools
          mapfile -t images < <(find artifacts -maxdepth 1 -type f -name '*.iso')
          [[ ${#images[@]} == 1 ]]
          # No --reuse-base, no --online, and no host-store mount. CI also
          # rejects snapshot reuse inside the driver itself.
          for mode in bios uefi; do
            firmware=(--firmware bios)
            if [[ "$mode" == uefi ]]; then
              firmware=(--firmware uefi
                --ovmf-code "$PWD/result-iso-test-tools/FV/OVMF_CODE.fd"
                --ovmf-vars "$PWD/result-iso-test-tools/FV/OVMF_VARS.fd")
            fi
            python3 -B scripts/iso_vm.py --iso "${images[0]}" --desktop "$DESKTOP" \
              "${firmware[@]}" --memory 6144 --cpus 2 \
              --qemu "$PWD/result-iso-test-tools/bin/qemu-system-x86_64" \
              --qemu-img "$PWD/result-iso-test-tools/bin/qemu-img" \
              --cache-dir "$RUNNER_TEMP/peasy-iso-vm-cache" \
              --output "$PWD/diagnostics/iso-vm-$mode"
          done
      - name: Preserve tray diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          for desktop in gnome xfce; do
            drv=$(nix eval --raw ".#checks.x86_64-linux.${desktop}-tray.drvPath") || continue
            nix log "$drv" > "diagnostics/${desktop}-tray.log" 2>&1 || true
          done
      - name: Upload installation timings and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: peasy-diagnostics-${{ matrix.desktop }}-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: peasy-iso-${{ matrix.desktop }}-${{ github.sha }}
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, security]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Serialize different tags too: latest-only R2 cleanup must not race uploads.
    concurrency:
      group: peasy-iso-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: peasy-iso-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Prepare locked R2 upload tools (before loading credentials)
        env:
          PEASY_REQUIRE_R2_SDK: "1"
        run: |
          nix build .#iso-release-tools --out-link result-release-tools
          ./result-release-tools/bin/python3 -B -m unittest discover -s scripts/tests -p test_r2_sdk.py -v --buffer
      - name: Package, verify and publish the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          ./result-release-tools/bin/python3 -B scripts/release_isos.py \
            --artifacts artifacts --tag "$TAG" --commit "$COMMIT"
